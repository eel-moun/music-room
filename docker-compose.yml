# Development stack: hot reload, debug ports, mailpit.
# Usage: make up   (production equivalent: docker-compose.prod.yml)
name: musicroom

services:
  api:
    build: ./backend
    env_file: .env
    # --reload watches the mounted code. Uvicorn can't combine --reload with --workers,
    # so dev runs 1 worker. Cross-worker realtime is tested with the prod file (2 workers).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    # The image runs as a non-root user (prod). In dev the code is mounted from the host,
    # and files the container writes (migrations, caches) must stay editable: run as root,
    # which rootless Docker maps to your own host user.
    user: root
    ports:
      - "8000:8000" # all interfaces: the phone reaches it via the LAN IP
    volumes:
      - ./backend:/app # live code; the venv lives in /opt/venv, so it isn't shadowed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18.6-alpine
    env_file: .env # reads POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    ports:
      - "127.0.0.1:5432:5432" # localhost only, for DB GUIs
    volumes:
      - pgdata:/var/lib/postgresql # Postgres 18+ mount point (not .../data)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8.4-alpine
    ports:
      - "127.0.0.1:6380:6379" # localhost only; 6380 because a host redis-server already uses 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:8025:8025" # web UI: http://localhost:8025
      - "127.0.0.1:1025:1025" # SMTP

volumes:
  pgdata:
